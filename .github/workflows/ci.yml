name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configuração de Node e pnpm para Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A versão vem do campo packageManager do package.json (pnpm@10.x).
      # Fixar "version: 9" aqui quebrava o install: engines.pnpm exige >=10.
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # B137: scan de vulnerabilidade automático — nada rodava antes.
      # --audit-level=critical, não high: os 2 "high" residuais hoje são
      # image-size (DoS via loop infinito, GHSA-w3rx-r6r6-pgpr/GHSA-5p2g-fcmc-qvqq)
      # sem fix disponível do upstream ("patched: <0.0.0"), só na cadeia de
      # build do Expo/Metro (dev tooling, nunca roda em produção/servidor) —
      # travar CI nisso é alarme falso permanente até o Expo atualizar.
      # Reavaliar para "high" quando o fix existir — conferir com
      # `pnpm audit --audit-level=high` de vez em quando.
      - name: Audit Node Dependencies
        run: pnpm audit --audit-level=critical

      - name: Frontend Build, Lint & Typecheck
        run: |
          pnpm --filter @sv/gestor run build --emptyOutDir
          pnpm --filter @sv/vitrine run build --emptyOutDir
          pnpm --filter @sv/admin run build --emptyOutDir
          pnpm --filter @sv/site run build --emptyOutDir

      # Configuração de Python para Backend API
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      # B138: scan de vulnerabilidade automático — nada rodava antes.
      # requirements.txt trocou de ranges (">=") pra "==" travado justamente
      # pra isto ter sentido: sem versão travada, o mesmo pip-audit passa
      # hoje e falha amanhã sem nenhum commit ter mudado nada.
      - name: Audit Python Dependencies
        run: |
          pip install pip-audit
          cd apps/api
          pip-audit -r requirements.txt

      - name: Check Python Compilation
        run: |
          cd apps/api
          python -m py_compile main.py limiter.py

      - name: Remove residual test database
        working-directory: apps/api
        shell: bash
        run: rm -f ci_test.db ci_test.db-shm ci_test.db-wal

      - name: Seed test database
        working-directory: apps/api
        env:
          API_DEBUG: "true"
          JWT_SECRET: "ci-test-secret-nao-usar-em-producao-32bytes-min"
          WEBHOOK_SECRET: "ci-test-webhook-secret-nao-usar-em-producao"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: python seed.py

      - name: Run Backend Tests (pytest)
        working-directory: apps/api
        env:
          API_DEBUG: "true"
          JWT_SECRET: "ci-test-secret-nao-usar-em-producao-32bytes-min"
          WEBHOOK_SECRET: "ci-test-webhook-secret-nao-usar-em-producao"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          pytest -v --junitxml=pytest-report.xml
          python ../../scripts/ci/check_pytest_skips.py pytest-report.xml
