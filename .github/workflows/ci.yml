name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configuração de Node e pnpm para Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A versão vem do campo packageManager do package.json (pnpm@10.x).
      # Fixar "version: 9" aqui quebrava o install: engines.pnpm exige >=10.
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Build, Lint & Typecheck
        run: |
          pnpm --filter @sv/gestor run build --emptyOutDir
          pnpm --filter @sv/vitrine run build --emptyOutDir
          pnpm --filter @sv/admin run build --emptyOutDir
          pnpm --filter @sv/site run build --emptyOutDir

      # Configuração de Python para Backend API
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Check Python Compilation
        run: |
          cd apps/api
          python -m py_compile main.py limiter.py

      - name: Remove residual test database
        working-directory: apps/api
        shell: bash
        run: rm -f ci_test.db ci_test.db-shm ci_test.db-wal

      - name: Seed test database
        working-directory: apps/api
        env:
          API_DEBUG: "true"
          JWT_SECRET: "ci-test-secret-nao-usar-em-producao-32bytes-min"
          WEBHOOK_SECRET: "ci-test-webhook-secret-nao-usar-em-producao"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: python seed.py

      - name: Run Backend Tests (pytest)
        working-directory: apps/api
        env:
          API_DEBUG: "true"
          JWT_SECRET: "ci-test-secret-nao-usar-em-producao-32bytes-min"
          WEBHOOK_SECRET: "ci-test-webhook-secret-nao-usar-em-producao"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          pytest -v --junitxml=pytest-report.xml
          python ../../scripts/ci/check_pytest_skips.py pytest-report.xml
