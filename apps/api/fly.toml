# Fly.io — Social Veículos API (FastAPI)
# Deploy: cd apps/api && fly deploy
app = "socialveiculos-api"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  API_DEBUG = "false"
  APP_ENV = "production"
  # Worker roda no mesmo app privado do Fly (rede .internal).
  WHATSAPP_WORKER_URL = "http://socialveiculos-worker.internal:8090"
  API_BASE_URL = "https://socialveiculos-api.fly.dev"
  # O app mobile (React Native) não é origem HTTP e ignora CORS; estas origens
  # cobrem só os fronts web publicados (Vercel). NUNCA incluir localhost aqui:
  # com allow_credentials=True, qualquer coisa rodando nessas portas na
  # máquina de um usuário logado herdaria as credenciais dele contra a API
  # de produção (B132) — dev usa o .env local, não este arquivo.
  # URLs conferidas contra o que está REALMENTE no ar (ARMADILHAS-PRODUCAO.md);
  # as antigas ficam listadas junto com as do domínio próprio até a migração
  # terminar — não desligar nenhuma antes da hora (B136).
  CORS_ORIGINS = "https://gestor-sigma-cyan.vercel.app,https://vitrine-cyan.vercel.app,https://admin-three-bay-23.vercel.app,https://site-one-nu-70.vercel.app,https://app.socialveiculos.com.br,https://socialveiculos.com.br,https://www.socialveiculos.com.br,https://painel-gestor.socialveiculos.com.br,https://admin.socialveiculos.com.br,https://sites.socialveiculos.com.br"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # backend tem worker de marketing + WebSockets: NÃO parar
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
