<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  /* Valores dark como fallback: se a mensagem `init` chegar antes do primeiro
     paint (caso normal), o React Native sobrescreve todas via `setTema`. Eram
     hardcoded aqui e o editor saía escuro no tema claro do app. */
  :root {
    --bg: #1c1d20;
    --input-bg: #26282c;
    --text: #e8e9ea;
    --text-dim: #a1a3a8;
    --text-muted: #888a90;
    --border: #33353a;
    --primary: #6ee7b7;
    --primary-text: #34d399;
    --primary-glow: rgba(52, 211, 153, 0.16);
    --overlay-soft: rgba(255,255,255,0.04);
    --error: #f43f5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: -apple-system, Roboto, sans-serif;
    /* Sem isto o WebView reescala o texto por conta própria e o corpo do
       contrato sai menor que o resto do app. */
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    /* Nada aqui dentro pode ser mais largo que a tela do celular. */
    width: 100%; max-width: 100%; overflow-x: hidden;
  }
  .rich-editor { max-width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--input-bg); overflow: hidden; }
  .re-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .re-tb {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-width: 30px; height: 30px; padding: 0 8px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-dim); font-size: 15px; cursor: pointer;
  }
  .re-tb.on { background: var(--primary-glow); color: var(--primary-text); }
  .re-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }
  .re-var-btn { font-weight: 600; color: var(--primary-text); }
  .re-var-wrap { position: relative; }
  /* `fixed` ancorava na viewport da WebView e o menu (~490px) estourava a
     altura real dela (~300px): abria fora da área visível e parecia que o
     botão não fazia nada. Agora fica no fluxo, logo abaixo da toolbar, e a
     WebView cresce junto (o ResizeObserver reporta a nova altura). */
  .re-var-menu {
    display: none; margin: 6px; max-height: 300px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .re-var-menu.open { display: flex; }
  .re-var-menu-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; color: var(--text); }
  #var-close { background: none; border: none; color: var(--text-muted); font-size: 18px; }
  .re-var-menu-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .re-var-group-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .re-var-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .re-var-chip {
    display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 10px; font-size: 14px; color: var(--text-dim); background: var(--input-bg);
  }
  .re-var-chip.custom { border-style: dashed; }
  .re-var-chip .rm { margin-left: 6px; opacity: .7; }
  .re-var-add { display: flex; gap: 6px; margin-top: 8px; }
  .re-var-add input {
    flex: 1; min-width: 0; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 16px; padding: 6px 8px;
  }
  .re-var-add-btn { background: var(--overlay-soft); border: 1px solid var(--border); border-radius: 6px; color: var(--text); width: 30px; }
  /* O container nativo se ajusta à altura real (mensagem `height`), então o
     mínimo aqui é só o piso do editor vazio. */
  .re-content { min-height: var(--min-content, 200px); display: flex; max-width: 100%; overflow: hidden; }
  .re-content .ProseMirror {
    flex: 1; padding: 12px 14px; outline: none; color: var(--text); font-size: 16px; line-height: 1.6;
    /* `min-width: auto` (padrão do item flex) deixa o editor crescer até caber a
       maior "palavra" do documento. As linhas de assinatura dos modelos padrão
       são 50+ underscores seguidos: sem isto o conteúdo fica mais largo que a
       tela e o texto aparece cortado nas laterais. */
    min-width: 0; max-width: 100%;
    overflow-wrap: break-word; word-break: break-word;
  }
  .re-content .ProseMirror p { margin: 0 0 8px; }
  /* Sem tamanho próprio o h1 sai em 2em (32px) e uma frase como "CONTRATO DE
     COMPRA E VENDA DE VEÍCULO AUTOMOTOR" toma meia tela do celular. */
  .re-content .ProseMirror h1 { font-size: 1.3em; line-height: 1.3; margin: 12px 0 8px; }
  .re-content .ProseMirror h2 { font-size: 1.12em; line-height: 1.35; margin: 12px 0 6px; }
  .re-content .ProseMirror h3 { font-size: 1em; line-height: 1.4; margin: 10px 0 6px; }
  .re-content .ProseMirror ul, .re-content .ProseMirror ol { padding-left: 20px; margin: 0 0 8px; }
  .re-content .ProseMirror img { max-width: 100%; height: auto; border-radius: 4px; }
  .re-content .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder); color: var(--text-muted); float: left; height: 0; pointer-events: none;
  }
  /* `table-layout: fixed` obriga as colunas a caberem na largura da tela em vez
     de esticar a tabela até o texto caber (o que empurrava o editor para fora). */
  .re-content .ProseMirror table { border-collapse: collapse; width: 100%; max-width: 100%; table-layout: fixed; }
  .re-content .ProseMirror td, .re-content .ProseMirror th { border: 1px solid var(--border); padding: 6px 8px; }
  .re-content .ProseMirror th { background: var(--overlay-soft); }
  .rich-var {
    display: inline-flex; align-items: center; background: var(--primary-glow); color: var(--primary-text);
    border-radius: 4px; padding: 1px 4px; font-size: 0.95em; font-weight: 600;
  }
  .rich-var::before { content: "{"; opacity: .5; margin-right: 1px; }
  .rich-var::after { content: "}"; opacity: .5; margin-left: 1px; }
</style>
</head>
<body>
  <div class="rich-editor">
    <div class="re-toolbar">
      <button type="button" class="re-tb" data-cmd="bold">B</button>
      <button type="button" class="re-tb" data-cmd="italic"><i>I</i></button>
      <button type="button" class="re-tb" data-cmd="strike"><s>S</s></button>
      <span class="re-sep" data-compact-hide></span>
      <button type="button" class="re-tb" data-cmd="bulletList" data-compact-hide>•—</button>
      <button type="button" class="re-tb" data-cmd="orderedList" data-compact-hide>1.—</button>
      <span class="re-sep"></span>
      <button type="button" class="re-tb" data-cmd="alignLeft">⟵</button>
      <button type="button" class="re-tb" data-cmd="alignCenter">↔</button>
      <button type="button" class="re-tb" data-cmd="alignJustify">☰</button>
      <span class="re-sep" data-compact-hide></span>
      <button type="button" class="re-tb" data-cmd="table" data-compact-hide>▦</button>
      <div class="re-var-wrap">
        <button type="button" id="var-btn" class="re-tb re-var-btn">+ Variável</button>
      </div>
      <span class="re-sep" data-compact-hide></span>
      <button type="button" class="re-tb" data-cmd="undo" data-compact-hide>↶</button>
      <button type="button" class="re-tb" data-cmd="redo" data-compact-hide>↷</button>
    </div>
    <!-- Fora da toolbar: ocupa a largura toda do editor e empurra o conteúdo
         para baixo em vez de flutuar sobre uma área que não existe. -->
    <div class="re-var-menu" id="var-menu">
      <div class="re-var-menu-head">
        Inserir variável
        <button type="button" id="var-close">×</button>
      </div>
      <div class="re-var-menu-body" id="var-menu-body"></div>
    </div>
    <div class="re-content" id="editor"></div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
